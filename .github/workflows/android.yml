
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CassetteShowcase-AndroidStudio.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack Android project
        run: unzip -q CassetteShowcase-AndroidStudio.zip

      - name: Build debug APK
        working-directory: CassetteShowcase/CassetteShowcase
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CassetteShowcase-debug-apk
          path: CassetteShowcase/CassetteShowcase/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
